# Publica la versión completa de VOXA (voxa/prototype) en GitHub Pages: https con cámara y micrófono en vivo.
# Requiere activar una vez Settings → Pages → Source: «GitHub Actions».
name: Publicar VOXA en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "voxa/prototype/**"
      - ".github/workflows/voxa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: voxa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: voxa/prototype
      - id: deployment
        uses: actions/deploy-pages@v4
