<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Talkride Panel</title>
<link rel="stylesheet" href="voxa.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<header>
  <h1>Panel de la prueba</h1>
  <p>Sólo para el equipo: personas activas, si vuelven, qué practican, opiniones y gasto de IA. Pide la clave de administración (VOXA_ADMIN_TOKEN en Render).</p>
</header>
<main>
  <section class="card full">
    <label for="tok">Clave de administración</label>
    <input id="tok" class="field" type="password" autocomplete="off">
    <div class="btns"><button id="go" class="cta">Ver el panel</button></div>
    <p class="note" id="msg" role="status"></p>
  </section>
  <section class="card full hidden" id="out"></section>
</main>
<script type="module">
import { $, esc } from './shared.js';
const API = globalThis.VOXA_API_BASE || '';
try { $('tok').value = sessionStorage.getItem('talkride.admin') || ''; } catch {}
const get = async (path, tok) => {
  const r = await fetch(API + path, { headers: { Authorization: `Bearer ${tok}` } });
  if (r.status === 401) throw new Error('Clave incorrecta.');
  if (!r.ok) throw new Error(`Error ${r.status}`);
  return r.json();
};
const row = (k, v) => `<tr><td>${esc(k)}</td><td class="num">${esc(v ?? '—')}</td></tr>`;
$('go').addEventListener('click', async () => {
  const tok = $('tok').value.trim(); if (!tok) return;
  try { sessionStorage.setItem('talkride.admin', tok); } catch {}
  $('msg').textContent = 'Cargando…';
  try {
    const [b, u] = await Promise.all([get('api/admin/beta', tok), get('api/admin/usage', tok)]);
    const o = b.opiniones;
    $('out').innerHTML = `
      <h2>Uso (últimos 30 días)</h2>
      <div class="table-wrap"><table><tbody>
        ${row('Personas que practicaron', b.personas)}${row('Activas en los últimos 7 días', b.activas_7_dias)}
        ${row('Volvieron otro día', `${b.volvieron_otro_dia} (${b.personas ? Math.round(100 * b.volvieron_otro_dia / b.personas) : 0}%)`)}
        ${row('Días promedio por persona', b.dias_promedio_por_persona)}
      </tbody></table></div>
      <h3>Prácticas por tipo</h3>
      <div class="table-wrap"><table><tbody>${Object.entries(b.practicas_por_tipo).map(([k, v]) => row(k, v)).join('') || row('Sin prácticas aún', '')}</tbody></table></div>
      <h3>Personas activas por día</h3>
      <div class="table-wrap"><table><tbody>${Object.entries(b.activas_por_dia).map(([k, v]) => row(k, v)).join('') || row('Sin datos aún', '')}</tbody></table></div>
      <h2>Opiniones</h2>
      <div class="table-wrap"><table><tbody>
        ${row('Cantidad', o.cantidad)}${row('Estrellas (promedio de 1 a 5)', o.estrellas_promedio)}${row('NPS (de −100 a 100)', o.nps)}
      </tbody></table></div>
      <h3>Lo que más sirve</h3>
      <div class="table-wrap"><table><tbody>${Object.entries(o.lo_que_mas_sirve).map(([k, v]) => row(k, v)).join('') || row('Sin datos aún', '')}</tbody></table></div>
      <h3>Comentarios</h3>
      ${o.comentarios.map(c => `<blockquote class="memory"><strong>${c.estrellas} ★${c.nps != null ? ` · recomienda ${c.nps}/10` : ''}</strong> · ${esc(c.fecha)}<br>${esc(c.comentario)}</blockquote>`).join('') || '<p class="note">Sin comentarios aún.</p>'}
      <h2>Coach IA</h2>
      <div class="table-wrap"><table><tbody>
        ${row('Gasto del mes (US$)', u.spent_this_month_usd)}${row('Costo promedio por llamada (US$)', u.usd_per_call)}
        ${Object.entries(u.models || {}).map(([k, v]) => row(`Modelo de ${k}`, v)).join('')}
      </tbody></table></div>`;
    $('out').classList.remove('hidden'); $('msg').textContent = '';
  } catch (e) { $('msg').textContent = e.message; }
});
</script>
</body>
</html>
