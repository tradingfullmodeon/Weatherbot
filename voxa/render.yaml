# Despliegue en Render (https://render.com): un servicio web con disco para los cupos y el gasto.
# 1) New + → Blueprint → este repositorio. 2) Cargar ANTHROPIC_API_KEY en el panel (no se guarda aquí).
services:
  - type: web
    name: voxa
    runtime: docker
    rootDir: voxa
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: voxa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOXA_PROVIDER          # anthropic | aws | bedrock | vertex | foundry
        value: anthropic
      - key: VOXA_MODEL
        value: claude-opus-5-5
      - key: VOXA_ADMIN_TOKEN       # para ver el gasto en /api/admin/usage
        generateValue: true
      - key: VOXA_REVENUECAT_AUTH   # el mismo valor que se configura en el webhook de RevenueCat
        sync: false
      - key: VOXA_REVENUECAT_SECRET # clave secreta de la API de RevenueCat: confirma una compra sin esperar al webhook
        sync: false
      - key: VOXA_CHECKOUT_URL      # opcional: link de pago web con {user}
        sync: false
      - key: VOXA_DEFAULT_PLAN
        value: prueba
      - key: VOXA_MONTHLY_BUDGET_USD
        value: "50"
      - key: VOXA_RATE_LIMIT
        value: "30"
